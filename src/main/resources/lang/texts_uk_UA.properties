custombook.hint.preview_controls=<html><small>Клацніть, щоб вибрати • перетягніть елемент, щоб перемістити його • перетягніть синю ручку, щоб змінити розмір.<br>Додавайте стільки текстових областей, скільки потрібно за допомогою <b>+ Текстова область</b>.</small></html>
