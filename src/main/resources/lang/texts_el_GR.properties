custombook.hint.navigation=<html><small>Οι ρυθμίσεις αποθηκεύονται στη τρέχουσα σελίδα, έτσι κάθε σελίδα έχει τα δικά της βέλη. Η προσαρμοσμένη εικόνα εμφανίζεται μόνο με το στυλ IMAGE. Οι υφές GUI, ITEM, και BLOCK χρησιμοποιούν όλες τη βιβλιοθήκη MCreator.</small></html>
custombook.hint.preview_controls=<html><small>Κλικ για επιλογή • σύρετε ένα στοιχείο για να το μετακινήσετε • σύρετε μια μπλε χειρολαβή για να αλλάξετε το μέγεθός του.<br>Προσθέστε όσες περιοχές κειμένου χρειάζεστε με <b>+ Περιοχή κειμένου</b>.</small></html>
