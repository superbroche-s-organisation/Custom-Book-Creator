custombook.hint.navigation=<html><small>تنظیمات در صفحه جاری ذخیره می‌شوند، بنابراین هر صفحه فلش‌های مخصوص خود را دارد. تصویر سفارشی فقط با سبک IMAGE ظاهر می‌شود. بافت‌های GUI، ITEM و BLOCK همه از کتابخانه MCreator استفاده می‌کنند.</small></html>
custombook.hint.preview_controls=<html><small>برای انتخاب کلیک کنید • برای جابجایی یک عنصر آن را بکشید • برای تغییر اندازه، دسته آبی را بکشید.<br>به هر تعداد که نیاز دارید، ناحیه متن اضافه کنید با <b>+ ناحیه متن</b>.</small></html>
