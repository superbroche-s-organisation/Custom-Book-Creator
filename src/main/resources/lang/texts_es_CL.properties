custombook.hint.writing=Add writing zones in the book editor. FREE = player text; PRESET = predefined choices; BOTH = either.<br>Writing books cannot stack. Signing permanently locks every zone on that copy.<br>Permissions are checked on the server when opening, saving and signing.<br>Each book can hold 64 zones, up to 1,024 characters per zone and 4,096 characters in total.<br>Player text is plain text. The signature trigger runs once and receives the signed itemstack.
